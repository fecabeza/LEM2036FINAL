<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SISTEMA DE RECICLAJE PARA EL FUTURO - LEM2036 - SCHOOL OF THE FUTURE - RED COGNITA</title>
  
  <!-- Meta etiquetas para Instalación Móvil / PWA -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LEM2036">
  <link id="appleTouchIcon" rel="apple-touch-icon" href="">
  <link id="appManifestLink" rel="manifest" href="">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería externa auto-Eajustable para generación de Código QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    /* Efecto de espejo para la cámara frontal */
    .mirror {
      transform: scaleX(-1);
    }
    /* Animación de escáner */
    @keyframes scan {
      0% { top: 0%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 0%; opacity: 0.8; }
    }
    .scanner-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #34d399, transparent);
      box-shadow: 0 0 15px #34d399;
      animation: scan 2.5s ease-in-out infinite;
    }
    /* Estilos para scroll suave */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Encabezado Personalizado -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-30 px-4 py-4 shadow-md">
    <div class="max-w-5xl mx-auto flex flex-col items-center text-center gap-3">
      <div class="flex flex-col items-center gap-2">
        <div>
          <h1 class="font-black text-base sm:text-xl tracking-wider text-white leading-snug">
            SISTEMA DE RECICLAJE PARA EL FUTURO<br>
            <span class="text-emerald-400 text-xl sm:text-3xl font-extrabold tracking-widest">LEM2036</span><br>
            <span class="text-sm sm:text-base font-bold text-slate-200">SCHOOL OF THE FUTURE</span><br>
            <span class="text-xs sm:text-sm font-semibold text-teal-300">RED COGNITA</span>
          </h1>
          <p class="text-base sm:text-xl font-extrabold text-amber-300 mt-2 tracking-wide">Leonor Pulgar - Mariana Cabezas 5°E</p>
          
          <!-- Botones Pantalla Completa y Aprender centrados y más grandes debajo de los textos -->
          <div class="flex flex-wrap items-center justify-center gap-3 mt-3.5">
            <button id="fullscreenBtn" class="text-sm sm:text-base bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold py-2.5 px-5 rounded-xl border border-slate-500 shadow-md transition shrink-0 flex items-center gap-2" title="Pantalla Completa">
              <span>⛶ Pantalla Completa</span>
            </button>
            <button id="toggleGuideBtn" class="text-sm sm:text-base bg-emerald-500/25 hover:bg-emerald-500/35 text-emerald-300 font-bold py-2.5 px-5 rounded-xl border border-emerald-500/40 shadow-md transition shrink-0 flex items-center gap-2">
              <span>💡 Aprender</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido Principal Ampliado para Tabletas -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

    <!-- Banner Ilustrativo: Leonor y Mariana ("Escanea tu basura") -->
    <div class="w-full max-w-2xl mx-auto rounded-2xl overflow-hidden shadow-2xl border border-slate-700 bg-slate-800 relative">
      <div id="imageBannerContainer" class="relative w-full bg-slate-900 overflow-hidden">
        <img src="https://lh3.googleusercontent.com/d/1cYn5a9dTNzOnB8QnrKHxPSUHAI3Av6-1" alt="Leonor y Mariana - Escanea tu basura" class="w-full h-auto block object-cover" onerror="this.onerror=null; this.src='Encabezado.jpeg';">
      </div>
    </div>

    <!-- Espacio de Trabajo Responsive: Visor arriba, Resultado abajo -->
    <div id="scannerWorkspace" class="flex flex-col gap-6 w-full max-w-2xl mx-auto">
      
      <!-- Tarjeta del Visor de la Cámara -->
      <div id="cameraCard" class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-xl flex flex-col w-full transition-all duration-300">
        <div class="relative bg-black aspect-[4/3] flex items-center justify-center overflow-hidden">
        
          <!-- Elemento de Video -->
          <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover mirror"></video>
          
          <!-- Canvas oculto para procesar foto -->
          <canvas id="snapshotCanvas" class="hidden"></canvas>

          <!-- Capa de Solicitud de Cámara -->
          <div id="startCameraPrompt" class="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center text-center p-5 gap-3 z-10 overflow-y-auto">
            <div class="p-3.5 bg-emerald-500/10 rounded-full text-emerald-400 border border-emerald-500/20">
              <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
              </svg>
            </div>
            <h2 class="text-base font-bold text-slate-100">Activar Cámara para Escanear</h2>
            <p id="cameraPromptDesc" class="text-xs text-slate-300 max-w-sm leading-relaxed">
              Selecciona una opción para encender la cámara de tu dispositivo:
            </p>
            
            <!-- Botones para cámara en vivo (HTTPS / Vista Previa) -->
            <div id="liveCamButtons" class="flex flex-wrap items-center justify-center gap-2 mt-1">
              <button id="connectFrontCamBtn" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 px-4 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                Cámara Frontal en Vivo
              </button>
              <button id="connectBackCamBtn" class="bg-teal-500/20 hover:bg-teal-500/30 text-teal-300 border border-teal-500/40 font-bold py-2.5 px-4 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                </svg>
                Cámara Trasera en Vivo
              </button>
            </div>

            <!-- Botones directos de Cámara Nativa (Funciona siempre incluso enviado por WhatsApp / file://) -->
            <div class="flex flex-wrap items-center justify-center gap-2 mt-1 w-full max-w-sm">
              <label class="flex-1 min-w-[140px] cursor-pointer bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs py-3 px-3 rounded-xl transition text-center shadow-lg flex items-center justify-center gap-1.5">
                <span>📸 Cámara Frontal (Foto)</span>
                <input type="file" id="nativeFrontInput" accept="image/*" capture="user" class="hidden">
              </label>
              <label class="flex-1 min-w-[140px] cursor-pointer bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs py-3 px-3 rounded-xl border border-slate-500 transition text-center shadow-lg flex items-center justify-center gap-1.5">
                <span>📷 Cámara Trasera (Foto)</span>
                <input type="file" id="nativeBackInput" accept="image/*" capture="environment" class="hidden">
              </label>
            </div>
          </div>

          <!-- Capa de Escaneo (Animación) -->
          <div id="scannerOverlay" class="absolute inset-0 hidden bg-emerald-950/20 pointer-events-none z-20">
            <div class="scanner-line"></div>
            <div class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-[2px]">
              <div class="bg-slate-900/90 border border-emerald-500/50 rounded-xl p-4 text-center shadow-2xl flex flex-col items-center gap-2">
                <div class="w-8 h-8 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-semibold text-emerald-400">Analizando residuo con IA...</p>
                <p class="text-xs text-slate-400">Generando ficha y QR en LEM2036</p>
              </div>
            </div>
          </div>

          <!-- Mensaje de Error / Cámara bloqueada -->
          <div id="cameraError" class="hidden absolute inset-0 bg-slate-900/95 p-5 flex flex-col items-center justify-center text-center gap-3 z-20 overflow-y-auto">
            <svg class="w-10 h-10 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h1
